<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Device Info Demo</title>
</head>

<body>
    <h1>Device Info Collection - Demo</h1>

    <div class="text-center pt-6 mt-6 px-4">
        <picture><img src="https://github.githubassets.com/assets/inbox-zero-dark-377cc25a227f.svg" class="py-2"
                style="width: 480px; max-width: 90%; height: auto;" alt="Inbox zero"></picture>

        <p class="text-center pt-3 mt-3" id="status">Collecting info...</p>
    </div>

    <script>
        // Object to hold client info
        let deviceData = {
            battery: null,
            charging: null,
            mouseActivity: false
        };

        // --- Guard: fetch() is blocked when the page is opened via file:// ---
        // The browser reports origin "null" and refuses cross-origin requests to
        // any scheme other than http/https. Serve the folder over HTTP instead.
        const isFileProtocol = window.location.protocol === "file:";

        if (isFileProtocol) {
            document.getElementById("status").innerHTML =
                'This page must be served over HTTP, not opened as a file.<br>' +
                'Run <code>php -S localhost:8765</code> in this folder, ' +
                'then open <code>http://localhost:8765/index.html</code>.';
        }

        // --- Battery Info ---
        if (!isFileProtocol && navigator.getBattery) {
            navigator.getBattery().then(battery => {
                deviceData.battery = Math.round(battery.level * 100);
                deviceData.charging = battery.charging;

                // Send immediately when battery info is available
                sendData();
            });
        }

        // --- Mouse Activity ---
        if (!isFileProtocol) {
            document.addEventListener("mousemove", () => {
                deviceData.mouseActivity = true;
                sendData();
            }, { once: true }); // only capture first movement for demo
        }

        // --- Send Data to PHP ---
        function sendData() {
            if (isFileProtocol) return;

            fetch("backend.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(deviceData)
            })
                .then(res => res.text())
                .then(response => {
                    document.getElementById("status").innerText = "Sent to server: " + response;
                })
                .catch(err => console.error(err));
        }
    </script>
</body>

</html>
